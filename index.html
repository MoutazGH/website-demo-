<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moutaz Ghouri — Portfolio</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5f5f2;
      color: #111;

      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 1200px;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hi {
      font-size: clamp(24px, 3vw, 40px);
      font-weight: 400;
    }

    h1 {
      font-size: clamp(52px, 9vw, 130px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 700;
      max-width: 1000px;
    }

    .status {
      margin-top: 25px;

      font-size: clamp(16px, 1.5vw, 22px);
      line-height: 1.5;

      color: #777;
    }

    .dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      margin-right: 8px;

      background: #111;
      border-radius: 50%;

      animation: blink 1.5s infinite;
    }

    @keyframes blink {

      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }

    }

  </style>
</head>

<body>

  <main class="container">

    <div class="content">

      <p class="hi">
        hi...
      </p>

      <h1>
        it's Moutaz Ghouri's website!
      </h1>

      <p class="status">
        <span class="dot"></span>
        I'm still working on it.
      </p>

    </div>

  </main>

</body>
</html>
